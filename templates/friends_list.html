{% extends "base.html" %}

{% block title %}Goal Mole: Friends List{% endblock %}

{% block content %}
    <div class="requests-result-search">
        {% if exist == False %}
            <h1>You currently have nobody friended.</h1>
        {% else %}
            {% for name in names %}
                <div class="card">
                    <img class="profile_pictures" id="pfp_requests_search" src="{{ url_for('get_profile_picture', username=name) }}">
                    <h2>{{ name }}</h2>
                </div>
            {% endfor %}
        {% endif %}
    </div>
<style>
    .card {
        display: flex;
        align-items: center;
        gap: 2vw;

        width: 84vw; /*The gap is 1 on each side and the is sidebar is 15*/
        min-height: 6vw;
        padding: 1vw;
        border: 1px solid #ddd;
        border-radius: 12px;
        margin-bottom: 1vh;
        margin-left: 15vw;

        box-sizing: border-box;
    }

    .card img {
        width: 5vw;
        height: 5vw;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
    }

    .card h2 {
        font-size: 1.5vw;
        margin: 0;
    }
</style>
{% endblock %}
